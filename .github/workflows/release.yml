name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0 or v1.0.0 - leave blank to use core/__init__.py)'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Resolve Release Version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:INPUT_VERSION) {
            $rawVer = $env:INPUT_VERSION.Trim().TrimStart('v')
            $tag = "v$rawVer"
          } elseif ($env:GITHUB_REF -match '^refs/tags/(.+)$') {
            $tag = $matches[1]
            $rawVer = $tag.TrimStart('v')
          } else {
            $pyVer = (python -c "from core import __version__; print(__version__)").Trim()
            $rawVer = $pyVer
            $tag = "v$rawVer"
          }
          Write-Host "=========================================="
          Write-Host "Resolved Version : $rawVer"
          Write-Host "Resolved Tag     : $tag"
          Write-Host "=========================================="
          "RELEASE_VERSION=$rawVer" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Inno Setup Compiler
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          $innoPath = "C:\Program Files (x86)\Inno Setup 6"
          if (Test-Path $innoPath) {
            Write-Host "Adding $innoPath to GITHUB_PATH"
            "$innoPath" >> $env:GITHUB_PATH
          } else {
            Write-Warning "Inno Setup path not found at $innoPath"
          }

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests -v

      - name: Build PyInstaller Directory Bundle
        run: |
          python -m PyInstaller --clean -y pdownloader.spec

      - name: Build PyInstaller Standalone Portable Executable
        run: |
          python -m PyInstaller --clean -y P-Downloader-Portable.spec

      - name: Compile Inno Setup Windows Installer
        shell: pwsh
        run: |
          ISCC.exe "/DMyAppVersion=$env:RELEASE_VERSION" installer.iss
          if (-not (Test-Path "Output\P-Downloader-Setup.exe")) {
            throw "Inno Setup compiler failed to generate Output\P-Downloader-Setup.exe"
          }
          Write-Host "Installer successfully compiled."

      - name: Assemble Release Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null

          # 1. Setup Installer (.exe)
          Copy-Item "Output\P-Downloader-Setup.exe" "release\P-Downloader-Setup-v$env:RELEASE_VERSION.exe"

          # 2. Standalone Single-File Portable Executable (.exe)
          Copy-Item "dist\P-Downloader-Portable.exe" "release\P-Downloader-v$env:RELEASE_VERSION-Portable.exe"

          # 3. Portable Directory Archive (.zip)
          Compress-Archive -Path "dist\P-Downloader\*" -DestinationPath "release\P-Downloader-v$env:RELEASE_VERSION-Windows-x64-Portable.zip" -CompressionLevel Optimal

          # 4. Chrome / Edge Browser Extension (.zip)
          Compress-Archive -Path "browser_extension\*" -DestinationPath "release\pdownloader-browser-extension-v$env:RELEASE_VERSION.zip" -CompressionLevel Optimal

          # 5. Generate SHA-256 Checksums
          Get-ChildItem -Path release -File | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Path "release\SHA256SUMS.txt" -Encoding utf8

          Write-Host "Release Artifacts Summary:"
          Get-ChildItem -Path release | Select-Object Name, Length

          Write-Host "SHA256 Checksums:"
          Get-Content "release\SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: P-Downloader ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          files: release/*
