name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0 or v1.0.0 - leave blank to use core/__init__.py)'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Binaries & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Resolve Release Version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:INPUT_VERSION) {
            $rawVer = $env:INPUT_VERSION.Trim().TrimStart('v')
            $tag = "v$rawVer"
          } elseif ($env:GITHUB_REF -match '^refs/tags/(.+)$') {
            $tag = $matches[1]
            $rawVer = $tag.TrimStart('v')
          } else {
            $pyVer = (python -c "from core import __version__; print(__version__)").Trim()
            $rawVer = $pyVer
            $tag = "v$rawVer"
          }
          Write-Host "Resolved Version : $rawVer"
          Write-Host "Resolved Tag     : $tag"
          "RELEASE_VERSION=$rawVer" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Inno Setup Compiler
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          $innoPath = "C:\Program Files (x86)\Inno Setup 6"
          if (Test-Path $innoPath) {
            Write-Host "Adding $innoPath to GITHUB_PATH"
            "$innoPath" >> $env:GITHUB_PATH
          }

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests -v

      - name: Build PyInstaller Directory Bundle
        run: |
          python -m PyInstaller --clean -y pdownloader.spec

      - name: Build PyInstaller Standalone Portable Executable
        run: |
          python -m PyInstaller --clean -y P-Downloader-Portable.spec

      - name: Compile Inno Setup Windows Installer
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) {
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
              $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
            } elseif (Test-Path "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe") {
              $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
            } else {
              throw "ISCC.exe could not be located."
            }
          }
          Write-Host "Using Inno Setup compiler: $iscc"
          & $iscc "/DMyAppVersion=$env:RELEASE_VERSION" installer.iss
          if (-not (Test-Path "Output\P-Downloader-Setup.exe")) {
            throw "Inno Setup compiler failed to generate Output\P-Downloader-Setup.exe"
          }

      - name: Assemble Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows-assets | Out-Null
          Copy-Item "Output\P-Downloader-Setup.exe" "windows-assets\P-Downloader-Setup-v$env:RELEASE_VERSION.exe"
          Copy-Item "Output\P-Downloader-Setup.exe" "windows-assets\P-Downloader-Setup.exe"
          Copy-Item "dist\P-Downloader-Portable.exe" "windows-assets\P-Downloader-v$env:RELEASE_VERSION-Portable.exe"
          Copy-Item "dist\P-Downloader-Portable.exe" "windows-assets\P-Downloader-Portable.exe"
          Compress-Archive -Path "dist\P-Downloader\*" -DestinationPath "windows-assets\P-Downloader-v$env:RELEASE_VERSION-Windows-x64-Portable.zip" -CompressionLevel Optimal
          Copy-Item "windows-assets\P-Downloader-v$env:RELEASE_VERSION-Windows-x64-Portable.zip" "windows-assets\P-Downloader-Windows-x64-Portable.zip"
          Compress-Archive -Path "browser_extension\*" -DestinationPath "windows-assets\pdownloader-browser-extension-v$env:RELEASE_VERSION.zip" -CompressionLevel Optimal
          Copy-Item "windows-assets\pdownloader-browser-extension-v$env:RELEASE_VERSION.zip" "windows-assets\pdownloader-browser-extension.zip"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: windows-assets/*

  build-linux:
    name: Build Linux Portable Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Resolve Release Version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            RAW_VER=$(echo "$INPUT_VERSION" | sed 's/^v//')
          elif [[ "${{ github.ref }}" =~ ^refs/tags/(.+)$ ]]; then
            RAW_VER=$(echo "${BASH_REMATCH[1]}" | sed 's/^v//')
          else
            RAW_VER=$(python3 -c "from core import __version__; print(__version__)")
          fi
          echo "RELEASE_VERSION=$RAW_VER" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile PyInstaller Linux Bundle
        run: |
          python -m PyInstaller --clean -y pdownloader.spec

      - name: Package Linux Archive (.tar.gz)
        run: |
          mkdir -p linux-assets
          tar -czvf "linux-assets/P-Downloader-v${RELEASE_VERSION}-Linux-x64.tar.gz" -C dist P-Downloader
          cp "linux-assets/P-Downloader-v${RELEASE_VERSION}-Linux-x64.tar.gz" "linux-assets/P-Downloader-Linux-x64.tar.gz"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: linux-assets/*

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Version & Tag
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            RAW_VER=$(echo "$INPUT_VERSION" | sed 's/^v//')
            TAG="v$RAW_VER"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/(.+)$ ]]; then
            TAG="${BASH_REMATCH[1]}"
            RAW_VER=$(echo "$TAG" | sed 's/^v//')
          else
            RAW_VER=$(python3 -c "from core import __version__; print(__version__)")
            TAG="v$RAW_VER"
          fi
          echo "RELEASE_VERSION=$RAW_VER" >> $GITHUB_ENV
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble Release Assets and Generate Checksums
        run: |
          mkdir -p release-final
          find artifacts -type f -exec cp {} release-final/ \;
          cd release-final
          sha256sum * > SHA256SUMS.txt
          echo "================ Final Release Artifacts ================"
          ls -lh
          echo "================ SHA256 Checksums ========================"
          cat SHA256SUMS.txt

      - name: Create Release Body Notes
        shell: bash
        run: |
          cat << 'EOF' > release_notes.md
          ## 📥 Quick Download Links

          | Package | Platform | Direct Download |
          | :--- | :--- | :--- |
          | 🪟 **Windows Setup Installer** | Windows 10/11 (x64) | [**Download P-Downloader-Setup.exe**](https://github.com/pkgtm2419/p-downloader/releases/download/${{ env.RELEASE_TAG }}/P-Downloader-Setup.exe) |
          | 🪟 **Windows Standalone Portable** | Windows 10/11 (x64) | [**Download P-Downloader-Portable.exe**](https://github.com/pkgtm2419/p-downloader/releases/download/${{ env.RELEASE_TAG }}/P-Downloader-Portable.exe) |
          | 🪟 **Windows Portable Archive** | Windows (x64) | [**Download P-Downloader-Windows-x64-Portable.zip**](https://github.com/pkgtm2419/p-downloader/releases/download/${{ env.RELEASE_TAG }}/P-Downloader-Windows-x64-Portable.zip) |
          | 🐧 **Linux Standalone Tarball** | Linux (x64) | [**Download P-Downloader-Linux-x64.tar.gz**](https://github.com/pkgtm2419/p-downloader/releases/download/${{ env.RELEASE_TAG }}/P-Downloader-Linux-x64.tar.gz) |
          | 🌐 **Browser Extension** | Chrome / Edge / Brave / Firefox | [**Download pdownloader-browser-extension.zip**](https://github.com/pkgtm2419/p-downloader/releases/download/${{ env.RELEASE_TAG }}/pdownloader-browser-extension.zip) |

          ---
          ### ✨ Key Capabilities in This Release:
          - **Full Browser WebExtension**: In-page video sniffer bar, quality selector dropdown, HLS/M3U8 master playlist parsing, YouTube stream capture, and popup media link collector.
          - **Smart Windows Setup**: Automatically detects existing installations with upgrade or clean reinstall options.
          - **Download Dialog Fixes**: Reliable Pause, Stop, and Delete controls with zero auto-restart loop bugs.
          - **Multi-Connection Acceleration**: Slices downloads into up to 32 concurrent HTTP streams with network adapter bonding.
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: P-Downloader ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == true || github.event.inputs.prerelease == 'true' }}
          body_path: release_notes.md
          generate_release_notes: true
          files: release-final/*
