[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "p-downloader"
version = "1.0.3"
description = "High-speed multi-connection desktop download accelerator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "P-Downloader Contributors" }]
dependencies = [
    "PyQt6>=6.5.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "cryptography>=42.0.0"
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.4.0",
    "pytest>=7.4.0",
    "flake8>=6.1.0"
]
